{% extends "base.html" %}

{% block title %}
Anmelden | Career Hub
{% endblock %}

{% block content %}

<h1>Career Hub</h1>

<p>Geschützter Bewerbungsbereich</p>

{% if form.errors %}
    <p>
        Benutzername oder Passwort ist nicht korrekt.
    </p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div>
        <label for="{{ form.username.id_for_label }}">
            Benutzername
        </label>

        {{ form.username }}
    </div>

    <div>
        <label for="{{ form.password.id_for_label }}">
            Passwort
        </label>

        {{ form.password }}
    </div>

    <input
        type="hidden"
        name="next"
        value="{{ next }}"
    >

    <button type="submit">
        Anmelden
    </button>
</form>

{% endblock %}
